name: Habibi Android native-module compile

on:
  workflow_dispatch:

jobs:
  android-native-module:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo configuration
        run: npx expo-doctor

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Compile Android Kotlin sources
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: ezra-habibi-diagnostics-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
