name: Habibi Android native-module compile

on:
  pull_request:
    branches:
      - ezra/full-system-control
    paths:
      - "modules/ezra-habibi-tts/**"
      - "app.json"
      - "App.tsx"
      - "package.json"
      - ".github/workflows/habibi-android-module.yml"
  workflow_dispatch:

jobs:
  android-native-module:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo configuration
        run: npx expo-doctor

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Compile Android Kotlin sources
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --no-daemon
