name: EZRA Android APK with Habibi runtime

on:
  push:
    branches:
      - ezra/habibi-android-spike
    paths:
      - "App.tsx"
      - "modules/ezra-habibi-tts/**"
      - "package.json"
      - "app.json"
      - ".github/workflows/habibi-apk.yml"
  workflow_dispatch:

concurrency:
  group: habibi-apk
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout EZRA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.2.12479018 cmake;3.22.1"

      - name: Download verified Android Habibi C ABI
        uses: actions/download-artifact@v4
        with:
          name: ezra-habibi-audiocpp-android-arm64
          path: habibi-runtime
          repository: ${{ github.repository }}
          run-id: 42701773397
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install native runtime
        run: |
          ABI_DIR="modules/ezra-habibi-tts/android/src/main/jniLibs/arm64-v8a"
          mkdir -p "$ABI_DIR"
          cp habibi-runtime/libs/libaudiocpp.so "$ABI_DIR/"
          test -s "$ABI_DIR/libaudiocpp.so"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo and TypeScript
        run: |
          npx expo-doctor
          npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Assemble Android debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload EZRA Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ezra-habibi-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
