name: Build EZRA APK (GitHub only) # WebCrypto initialized before App module import

on:
  push:
    branches:
      - ezra/habibi-android-spike
      - ezra/stability-voice-memory-files
      - ezra/live-voice-and-file-fix
      - ezra/android-audio-output-repair
    paths:
      - '.github/workflows/build-apk.yml'
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'plugins/**'
      - 'src/**'
      - 'app/**'
      - 'assets/**'
      - 'modules/**'
      - 'scripts/**'
      - 'index.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Generate OPPO-compatible Android APK with Audar assets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout latest EZRA branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python for Audar reference preparation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download gated NeuCodec INT8 decoder and public demo reference
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::GitHub Actions secret HF_TOKEN is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          ASSET_DIR="modules/ezra-audar-tts/android/src/main/assets/audar"
          mkdir -p "$ASSET_DIR"
          curl --fail --location --retry 3 --silent --show-error \
            --header "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/neuphonic/neucodec-onnx-decoder-int8/resolve/main/model.onnx" \
            --output "$ASSET_DIR/model_int8.onnx"
          test "$(stat -c%s "$ASSET_DIR/model_int8.onnx")" -ge 250000000
          curl --fail --location --retry 3 --silent --show-error \
            "https://huggingface.co/audarai/Audar-TTS-V1-Flash/resolve/main/samples/demo_male_3_source.wav" \
            --output /tmp/demo_male_3_source.wav
          test "$(stat -c%s /tmp/demo_male_3_source.wav)" -gt 100000
          echo "NeuCodec decoder and Audar reference WAV downloaded and size-checked."

      - name: Install CPU PyTorch and NeuCodec reference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install librosa soundfile neucodec

      - name: Generate demo_male_3 reference codes
        run: |
          python scripts/prepare_audar_reference.py \
            /tmp/demo_male_3_source.wav \
            modules/ezra-audar-tts/android/src/main/assets/audar/demo_male_3_reference.json
          test -s modules/ezra-audar-tts/android/src/main/assets/audar/demo_male_3_reference.json

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Embed the JavaScript bundle in the debug APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          needle = "react {\n"
          if needle not in s:
              raise SystemExit("React Native Gradle react block not found")
          if "debuggableVariants = []" not in s:
              s = s.replace(needle, needle + "    debuggableVariants = []\n", 1)
          p.write_text(s)
          PY

      - name: Build arm64 Android APK for OPPO A76
        working-directory: android
        run: ./gradlew --no-daemon -PreactNativeArchitectures=arm64-v8a assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EZRA-OPPO-A76-AUDAR-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
