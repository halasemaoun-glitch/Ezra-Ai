name: Build EZRA APK (GitHub only)

on:
  push:
    branches:
      - ezra/habibi-android-spike
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app.json'
      - 'package.json'
      - 'plugins/**'
      - 'src/**'
      - 'app/**'
      - 'assets/**'
      - 'modules/**'
      - 'index.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Generate installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest EZRA branch
        uses: actions/checkout@v4
        with:
          ref: ezra/habibi-android-spike

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EZRA-latest-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
