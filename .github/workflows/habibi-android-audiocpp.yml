name: Habibi Android native engine cross-compile

on:
  push:
    branches:
      - ezra/habibi-android-spike
    paths:
      - "modules/ezra-habibi-tts/**"
      - "App.tsx"
      - "src/EzraOrb3D.tsx"
      - "package.json"
      - "app.json"
      - "docs/HABIBI_ANDROID_INTEGRATION.md"
      - ".github/workflows/habibi-android-audiocpp.yml"
  workflow_dispatch:

concurrency:
  group: habibi-android-native
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-arm64-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout EZRA
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.2.12479018 cmake;3.31.6"

      - name: Checkout audio.cpp with submodules
        run: |
          git clone --depth 1 --branch v0.9.4 --recurse-submodules https://github.com/0xShug0/audio.cpp.git audio-cpp

      - name: Configure Habibi runtime for Android arm64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          cmake -S audio-cpp -B build-habibi-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DAUDIOCPP_VERSION=0.9.4 \
            -DAUDIOCPP_MODEL_SET=custom \
            -DAUDIOCPP_MODELS=f5_tts \
            -DAUDIOCPP_BUILD_C_API=ON \
            -DAUDIOCPP_DEPLOYMENT_BUILD=ON \
            -DENGINE_ENABLE_OPENMP=OFF \
            -DGGML_OPENMP=OFF \
            -DENGINE_ENABLE_NATIVE_CPU=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DENGINE_ENABLE_LLAMAFILE=OFF \
            -DENGINE_ENABLE_CUDA=OFF \
            -DENGINE_ENABLE_HIP=OFF \
            -DENGINE_ENABLE_VULKAN=OFF \
            -DENGINE_ENABLE_WEBGPU=OFF \
            -DENGINE_ENABLE_METAL=OFF \
            -DENGINE_BUILD_TESTS=OFF \
            -DENGINE_BUILD_EXTENDED_TESTS=OFF \
            -DENGINE_BUILD_MODEL_TESTS=OFF

      - name: Compile Habibi C ABI for Android arm64
        run: cmake --build build-habibi-android --parallel 4 --target audiocpp

      - name: Build EZRA JNI bridge against the native runtime
        run: |
          ABI_DIR="modules/ezra-habibi-tts/android/src/main/jniLibs/arm64-v8a"
          mkdir -p "$ABI_DIR"
          cp build-habibi-android/bin/libaudiocpp.so "$ABI_DIR/"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S modules/ezra-habibi-tts/android/src/main/cpp -B build-ezra-habibi-jni \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ezra-habibi-jni --parallel 4 --target ezra_habibi_jni
          cp build-ezra-habibi-jni/libezra_habibi_jni.so "$ABI_DIR/"

      - name: Verify native library
        run: |
          test -s build-habibi-android/bin/libaudiocpp.so
          test -s modules/ezra-habibi-tts/android/src/main/jniLibs/arm64-v8a/libezra_habibi_jni.so
          file build-habibi-android/bin/libaudiocpp.so
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build-habibi-android/bin/libaudiocpp.so | grep -E "Class:|Machine:"

      - name: Verify C ABI exports and package integration inputs
        run: |
          LIB="build-habibi-android/bin/libaudiocpp.so"
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$NDK/llvm-nm" -D --defined-only "$LIB" | grep -q 'audiocpp_registry_create'
          "$NDK/llvm-nm" -D --defined-only "$LIB" | grep -q 'audiocpp_session_run'
          "$NDK/llvm-nm" -D --defined-only modules/ezra-habibi-tts/android/src/main/jniLibs/arm64-v8a/libezra_habibi_jni.so | grep -q 'Java_expo_modules_ezrahabibitts_EzraHabibiTtsModule_nativeInitialize'
          mkdir -p habibi-android-runtime/include habibi-android-runtime/libs
          cp "$LIB" habibi-android-runtime/libs/
          cp modules/ezra-habibi-tts/android/src/main/jniLibs/arm64-v8a/libezra_habibi_jni.so habibi-android-runtime/libs/
          cp audio-cpp/include/audiocpp.h habibi-android-runtime/include/
          cp audio-cpp/LICENSE habibi-android-runtime/
          "$NDK/llvm-readelf" -d "$LIB" > habibi-android-runtime/dependencies.txt
          "$NDK/llvm-nm" -D --defined-only "$LIB" | grep 'audiocpp_' > habibi-android-runtime/exports.txt

      - name: Upload Android native runtime
        uses: actions/upload-artifact@v4
        with:
          name: ezra-habibi-audiocpp-android-arm64
          path: habibi-android-runtime/
          if-no-files-found: error
          retention-days: 7

  android-app-build:
    needs: android-arm64-engine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout EZRA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.2.12479018 cmake;3.22.1"

      - name: Download Habibi Android runtime
        uses: actions/download-artifact@v4
        with:
          name: ezra-habibi-audiocpp-android-arm64
          path: habibi-runtime

      - name: Install native libraries into the Expo module
        run: |
          ABI_DIR="modules/ezra-habibi-tts/android/src/main/jniLibs/arm64-v8a"
          mkdir -p "$ABI_DIR"
          cp habibi-runtime/libs/libaudiocpp.so "$ABI_DIR/"
          mkdir -p modules/ezra-habibi-tts/android/src/main/cpp/include
          cp habibi-runtime/include/audiocpp.h modules/ezra-habibi-tts/android/src/main/cpp/include/
          test -s "$ABI_DIR/libaudiocpp.so"
          test -s modules/ezra-habibi-tts/android/src/main/cpp/include/audiocpp.h

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo and TypeScript
        run: |
          npx expo-doctor
          npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Configure debug APK to embed the JavaScript bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          source = path.read_text()
          needle = "react {"
          if source.count(needle) != 1:
              raise SystemExit("Expected exactly one React Native Gradle react block")
          source = source.replace(needle, needle + chr(10) + "    // Ship the JS bundle so this APK runs without Metro." + chr(10) + "    debuggableVariants = []", 1)
          path.write_text(source)
          assert "debuggableVariants = []" in path.read_text()

      - name: Assemble Android debug APK with Habibi native runtime
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "assets/index.android.bundle"
          echo "Verified: APK contains assets/index.android.bundle"

      - name: Upload EZRA Android APK with Habibi runtime
        uses: actions/upload-artifact@v4
        with:
          name: ezra-habibi-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

