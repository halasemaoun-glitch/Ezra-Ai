name: EZRA Audar-only Android build

on:
  push:
    branches:
      - ezra/android-audio-output-repair
    paths:
      - '.github/workflows/audar-only-cleanup.yml'

permissions:
  contents: write

jobs:
  audar-only:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout audio repair branch
        uses: actions/checkout@v4
        with:
          ref: ezra/android-audio-output-repair
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Gemini Live and all non-Audar speech output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("App.tsx")
          s = p.read_text()

          # Gemini Live is no longer started; keep Android speech recognition for microphone input.
          s, n = re.subn(
              r"if \(Platform\.OS === 'android' && !liveVoiceUnavailableRef\.current\) \{",
              "if (false) {",
              s, count=1
          )
          assert n == 1, "Could not locate Gemini Live startup gate"

          # Replace the complete speech function: Audar is the only speech synthesizer.
          new_speak = """  const speak = async (text: string, messageId: string) => {
            if (speakingMessageId === messageId) {
              await EzraAudarTts?.stopAudio().catch(() => {});
              activeSpokenTextRef.current = '';
              activeAudarSpeechRef.current = null;
              finishVoiceCaptureAfterPlayback();
              setSpeakingMessageId(null);
              return;
            }
            await EzraAudarTts?.stopAudio().catch(() => {});
            activeAudarSpeechRef.current = null;
            activeSpokenTextRef.current = text;
            setSpeakingMessageId(messageId);
            try {
              let speechText = text;
              if (Platform.OS === 'android') {
                try {
                  speechText = await diacritizeArabicLocally(text);
                } catch (error) {
                  console.warn('Optional Arabic diacritization unavailable; using original text:', error);
                }
              }
              if (activeSpokenTextRef.current !== text) return;
              const ready = await ensureAudarReady();
              if (!ready) throw new Error('Audar did not initialize.');
              if (activeSpokenTextRef.current !== text) return;
              await playAudarMessage(speechText, messageId);
            } catch (error) {
              activeAudarSpeechRef.current = null;
              setSpeakingMessageId(null);
              finishVoiceCaptureAfterPlayback();
              Alert.alert('تعذّر تشغيل Audar', error instanceof Error ? error.message : 'حاول مرة أخرى.');
            }
          };

"""
          pattern = r"  const speak = async \(text: string, messageId: string\) => \{.*?\n  \};\n\n  useEffect\(\(\) => \{\n    if \(!EzraAudarTts\) return;"
          replacement = new_speak + "  useEffect(() => {\n    if (!EzraAudarTts) return;"
          s, n = re.subn(pattern, lambda _: replacement, s, count=1, flags=re.S)
          assert n == 1, "Could not replace speech function with Audar-only implementation"

          # Keep Audar completion/error events, but never fall back to Android TTS.
          audar_effect = """  useEffect(() => {
            if (!EzraAudarTts) return;
            const finished = EzraAudarTts.addListener('onPlaybackFinished', () => {
              const completed = activeAudarSpeechRef.current;
              activeAudarSpeechRef.current = null;
              finishVoiceCaptureAfterPlayback();
              if (completed) setSpeakingMessageId(current => current === completed.messageId ? null : current);
              resumeBackgroundWake();
            });
            const failed = EzraAudarTts.addListener('onPlaybackError', () => {
              const pending = activeAudarSpeechRef.current;
              activeAudarSpeechRef.current = null;
              audarReadyRef.current = false;
              EzraAudarTts.shutdown().catch(() => {});
              finishVoiceCaptureAfterPlayback();
              setSpeakingMessageId(null);
              if (pending) Alert.alert('تعذّر تشغيل Audar', 'فشل تشغيل الصوت. أعد المحاولة لاحقاً.');
              resumeBackgroundWake();
            });
            return () => { finished.remove(); failed.remove(); };
          }, []);

"""
          pattern = r"  useEffect\(\(\) => \{\n    if \(!EzraAudarTts\) return;.*?\n  \}, \[selectedTtsVoice, speechRate, speechPitch, ttsVoices\]\);"
          s, n = re.subn(pattern, lambda _: audar_effect.rstrip(), s, count=1, flags=re.S)
          assert n == 1, "Could not replace Audar playback listeners"

          # Remove dormant Habibi synthesis implementation and listeners.
          s, n = re.subn(
              r"  const playHabibiMessage = async \(text: string, messageId: string\) => \{.*?\n  \};\n\n(?=  const copyMessage)",
              "",
              s, count=1, flags=re.S
          )
          assert n == 1, "Could not remove Habibi playback function"

          s, n = re.subn(
              r"  useEffect\(\(\) => \{\n    if \(!EzraHabibiTts\) return;.*?\n  \}, \[speechRate, speechPitch\]\);",
              "",
              s, count=1, flags=re.S
          )
          assert n == 1, "Could not remove Habibi playback listeners"

          # No synthesis fallback may remain in the app.
          assert "Speech.speak(" not in s, "A non-Audar Speech.speak fallback remains"
          p.write_text(s)
          print("Applied Audar-only voice patch.")
          PY

      - name: Commit Audar-only source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "Use Audar as the only EZRA speech engine"
          git push origin HEAD:ezra/android-audio-output-repair

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Embed JavaScript bundle in debug APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          needle = "react {\n"
          if needle not in s:
              raise SystemExit("React Native Gradle react block not found")
          if "debuggableVariants = []" not in s:
              s = s.replace(needle, needle + "    debuggableVariants = []\n", 1)
          p.write_text(s)
          PY

      - name: Build arm64 APK for OPPO A76
        working-directory: android
        run: ./gradlew --no-daemon -PreactNativeArchitectures=arm64-v8a assembleDebug

      - name: Publish Audar-only APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ezra-audar-only-${{ github.run_number }}
          name: EZRA AI - Audar Only
          prerelease: true
          generate_release_notes: false
          body: |
            Audar-only Android test build.
            Gemini Live and Habibi speech synthesis are disabled in the active app flow.
            Arabic speech output uses Audar only. Android speech recognition remains enabled for microphone input.
          files: android/app/build/outputs/apk/debug/app-debug.apk
