name: EZRA checks

concurrency:
  group: ezra-checks-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - ezra/arabic-navigation-polish
      - ezra/habibi-android-spike
      - ezra/live-voice-and-file-fix
      - ezra/gemini-live-stability
      - ezra/ichkil-on-device
      - ezra/audar-android-voice
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Hugging Face gated NeuCodec decoder access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN repository secret is missing."
            exit 1
          fi
          status=$(curl -sS -o /tmp/hf-model.json -w '%{http_code}' -H "Authorization: Bearer $HF_TOKEN" "https://huggingface.co/api/models/neuphonic/neucodec-onnx-decoder-int8")
          if [ "$status" != "200" ]; then
            echo "Hugging Face NeuCodec decoder access check failed (HTTP $status)."
            cat /tmp/hf-model.json
            exit 1
          fi
          echo "HF_TOKEN is present and NeuCodec decoder metadata is accessible."
      - name: Set up Python for Audar reference encoding
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Audar voice assets for Android
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          python -m pip install neucodec librosa huggingface_hub 'torchao<0.18.0'
          mkdir -p modules/ezra-audar-tts/android/src/main/assets/audar
          curl -fL "https://www.audarai.com/license/audarai-open-license-v1.0/" -o modules/ezra-audar-tts/android/src/main/assets/audar/AudarAI-Open-License-v1.0.html
          curl -fL "https://raw.githubusercontent.com/AudarAI/Audar-TTS-V1/main/NOTICE" -o modules/ezra-audar-tts/android/src/main/assets/audar/AUDAR-NOTICE.txt
          curl -fL "https://raw.githubusercontent.com/neuphonic/neucodec/main/LICENSE" -o modules/ezra-audar-tts/android/src/main/assets/audar/NEUCODEC-APACHE-2.0.txt
          curl -fL "https://huggingface.co/audarai/Audar-TTS-V1-Flash/raw/main/README.md" -o modules/ezra-audar-tts/android/src/main/assets/audar/Audar-Flash-Model-Card.md
          cat > modules/ezra-audar-tts/android/src/main/assets/audar/EZRA-AUDAR-MODIFICATIONS.txt <<'NOTICE'
          EZRA independently integrates Audar-TTS-V1-Flash Q4_K_M with llama.cpp and the NeuCodec INT8 ONNX decoder for on-device Arabic speech synthesis. The integration and Android bridge are modifications made by the EZRA project; they are not an official AudarAI release and are not endorsed or maintained by AudarAI. The bundled demo_male_3 reference is a synthetic voice profile supplied by AudarAI.
          NOTICE
          python - <<'PY'
          import os, shutil
          from huggingface_hub import hf_hub_download
          decoder = hf_hub_download(
              repo_id="neuphonic/neucodec-onnx-decoder-int8",
              filename="model.onnx",
              token=os.environ["HF_TOKEN"],
          )
          shutil.copy2(decoder, "modules/ezra-audar-tts/android/src/main/assets/audar/model_int8.onnx")
          PY
          curl -fL "https://huggingface.co/audarai/Audar-TTS-V1-Flash/resolve/main/samples/demo_male_3_ar.wav" -o /tmp/demo_male_3_ar.wav
          python scripts/prepare_audar_reference.py /tmp/demo_male_3_ar.wav modules/ezra-audar-tts/android/src/main/assets/audar/demo_male_3_reference.json
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Install dependencies
        run: npm install
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check EZRA Supabase Edge Functions
        run: |
          deno check supabase/functions/smart-service/index.ts
          deno check supabase/functions/gemini-live-token/index.ts
      - name: Test EZRA Supabase session security
        run: deno test supabase/functions/smart-service/auth_test.ts
      - name: Test EZRA personality contract
        run: deno test supabase/functions/smart-service/persona_test.ts
      - name: Test EZRA Groq request and response contract
        run: deno test supabase/functions/smart-service/groq_test.ts
      - name: Test EZRA Gemini request and response contract
        run: deno test supabase/functions/smart-service/gemini_test.ts
      - name: Test EZRA AI provider and model settings
        run: deno test src/ai/aiModelSettings_test.ts
      - name: Test EZRA microphone sensitivity controls
        run: deno test src/voice/micSensitivity_test.ts
      - name: Test EZRA voice language detection and profile
        run: deno test src/voice/voiceProfile_test.ts
      - name: Test EZRA assistant mode guidance and safety
        run: deno test src/modes/assistantModes_test.ts
      - name: Test EZRA Android contact command parsing
        run: deno test src/phone/commandParser_test.ts
      - name: Test EZRA direct SMS command parsing
        run: deno test src/phone/smsCommandParser_test.ts
      - name: Test EZRA expanded phone control commands
        run: deno test src/phone/phoneControlCommands_test.ts
      - name: Test EZRA expanded files notifications and media commands
        run: deno test src/phone/phoneActionCommands_test.ts
      - name: Test EZRA screenshot voice commands
        run: deno test src/phone/screenCaptureCommands_test.ts
      - name: Test EZRA accessibility commands
        run: deno test src/phone/accessibilityCommands_test.ts
      - name: Test EZRA knowledge library synchronization
        run: deno test src/knowledge/knowledgeSync_test.ts
      - name: Test EZRA knowledge library management
        run: deno test src/knowledge/knowledgeLibraryTools_test.ts
      - name: Test EZRA Arabic-aware knowledge retrieval
        run: deno test src/knowledge/knowledgeRetrieval_test.ts
      - name: Test EZRA document extraction helpers
        run: deno test src/documents/documentTextUtils_test.ts
      - name: Test EZRA study progress synchronization
        run: deno test src/study/studyProgressSync_test.ts
      - name: Test EZRA dental learning library
        run: deno test src/study/studyLibrary_test.ts
      - name: Test EZRA bilingual dental knowledge retrieval
        run: deno test src/study/dentalKnowledge_test.ts
      - name: Test EZRA companion profile synchronization
        run: deno test src/companion/companionProfileSync_test.ts
      - name: Check Expo configuration and dependencies
        run: npx expo-doctor
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found in $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Generate Android native project and verify config plugins
        run: npx expo prebuild --platform android --no-install
      - name: Compile Android Kotlin sources
        run: cd android && ./gradlew :app:compileDebugKotlin
      - name: Build standalone Android APK with embedded JavaScript bundle
        run: cd android && ./gradlew :app:assembleRelease
      - name: Sign standalone APK with temporary debug certificate
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --out android/app/build/outputs/apk/release/app-release-signed.apk android/app/build/outputs/apk/release/app-release.apk
          /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release-signed.apk
          mv android/app/build/outputs/apk/release/app-release-signed.apk android/app/build/outputs/apk/release/app-release.apk
      - name: Upload standalone Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezra-android-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Check TypeScript
        run: npm run typecheck
      - name: Bundle Android app
        run: npx expo export --platform android
      - name: Publish downloadable APK release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/ezra/audar-android-voice'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ezra-audar-${{ github.run_number }}
          name: EZRA AI Android APK (Audar) - Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Automatic test build of EZRA AI for Android.
            Includes Gemini Live, Audar TTS, Ichkil and Habibi fallback.
            Debug-signed APK for device testing; not a production-signed release.
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
