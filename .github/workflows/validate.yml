name: EZRA checks

on:
  push:
    branches:
      - main
      - ezra/arabic-navigation-polish
      - ezra/habibi-android-spike
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: Install dependencies
        run: npm install
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check EZRA Supabase Edge Function
        run: deno check supabase/functions/smart-service/index.ts
      - name: Test EZRA Supabase session security
        run: deno test supabase/functions/smart-service/auth_test.ts
      - name: Test EZRA personality contract
        run: deno test supabase/functions/smart-service/persona_test.ts
      - name: Test EZRA Groq request and response contract
        run: deno test supabase/functions/smart-service/groq_test.ts
      - name: Test EZRA voice language detection and profile
        run: deno test src/voice/voiceProfile_test.ts
      - name: Test EZRA assistant mode guidance and safety
        run: deno test src/modes/assistantModes_test.ts
      - name: Test EZRA Android contact command parsing
        run: deno test src/phone/commandParser_test.ts
      - name: Test EZRA expanded phone control commands
        run: deno test src/phone/phoneControlCommands_test.ts
      - name: Test EZRA screenshot voice commands
        run: deno test src/phone/screenCaptureCommands_test.ts
      - name: Test EZRA knowledge library synchronization
        run: deno test src/knowledge/knowledgeSync_test.ts
      - name: Test EZRA knowledge library management
        run: deno test src/knowledge/knowledgeLibraryTools_test.ts
      - name: Test EZRA document extraction helpers
        run: deno test src/documents/documentTextUtils_test.ts
      - name: Test EZRA study progress synchronization
        run: deno test src/study/studyProgressSync_test.ts
      - name: Test EZRA companion profile synchronization
        run: deno test src/companion/companionProfileSync_test.ts
      - name: Check Expo configuration and dependencies
        run: npx expo-doctor
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found in $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Generate Android native project and verify config plugins
        run: npx expo prebuild --platform android --no-install
      - name: Compile Android Kotlin sources
        run: cd android && ./gradlew :app:compileDebugKotlin
      - name: Check TypeScript
        run: npm run typecheck
      - name: Bundle Android app
        run: npx expo export --platform android
