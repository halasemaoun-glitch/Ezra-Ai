name: EZRA checks

on:
  push:
    branches:
      - main
      - ezra/arabic-navigation-polish
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: Install dependencies
        run: npm install
      - name: Check Expo configuration and dependencies
        run: npx expo-doctor
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Generate Android native project and verify config plugins
        run: npx expo prebuild --platform android --no-install
      - name: Compile Android Kotlin sources
        run: cd android && ./gradlew :app:compileDebugKotlin
      - name: Check TypeScript
        run: npm run typecheck
      - name: Bundle Android app
        run: npx expo export --platform android
