apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.ezrasupertonic3'
version = '0.1.0'

android {
  namespace 'expo.modules.ezrasupertonic3'
  defaultConfig {
    versionName '0.1.0'
    minSdkVersion 24
  }
}

dependencies {
  // CPU-only ONNX Runtime for local Supertonic inference; model weights are
  // downloaded separately into app-private storage and are not bundled in the APK.
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.1'
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
}
